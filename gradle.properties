org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true

android.useAndroidX=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
# AGP empfiehlt dazu excludeLibraryComponentsFromConstraints. Der Schalter ist
# aber selbst schon als veraltet gemeldet, und mit ihm scheitert der Build an
# mergeReleaseJavaResource - ausprobiert, nicht vermutet. Die Empfehlung
# betrifft ohnehin nur die Einlesezeit sehr grosser Projekte. Bis AGP das
# aufloest, bleibt sie stumm.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
