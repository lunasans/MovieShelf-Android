org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
# Beide Schalter standen auf "false" und erzwangen damit das Verhalten vor
# AGP 9 - gesetzt vom Upgrade-Assistenten, damit sich beim Versionssprung
# nichts aendert. Genau das hielt aber die Ressourcen-Optimierung an, die die
# Play Console unter "App-Optimierung" anmahnt. Die Vorgabe ist inzwischen
# "true"; die Zeilen entfallen ersatzlos.
# Diese beiden bleiben bewusst stehen, obwohl AGP sie als veraltet meldet:
# Die neue DSL setzt AGPs eingebautes Kotlin voraus, und das externe Plugin
# org.jetbrains.kotlin.android scheitert daran mit
# "ApplicationExtensionImpl cannot be cast to BaseExtension". Das eingebaute
# Kotlin wiederum vertraegt kein kapt - dafuer muesste Room erst auf KSP
# umziehen. Ein eigenes Vorhaben, kein Nebenbei-Schalter.
android.builtInKotlin=false
android.newDsl=false
org.gradle.configuration-cache=true
