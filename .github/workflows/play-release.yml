name: Play Store Release

# Ausgelöst durch Tag "v*" (analog zum Desktop-Release-Flow) oder manuell.
# Baut ein signiertes App Bundle und lädt es in den geschlossenen Test (Alpha)
# hoch — dort sitzen die Tester. Die Promotion zu Beta/Produktion passiert
# bewusst manuell in der Play Console.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Dieselbe Definition wie bei jedem Pull Request, wiederverwendet statt
  # kopiert: eine zweite Fassung waere die erste, die veraltet.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [ci]
    runs-on: ubuntu-latest
    # Fuer das Anlegen des GitHub-Releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Upload-Keystore bereitstellen
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Signiertes App Bundle bauen
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --console=plain

      # "alpha" ist der API-Name des geschlossenen Tests; einen Track "closed"
      # gibt es nicht. Anders als der interne Test durchläuft er Googles
      # Prüfung — jeder Tag-Push zieht sie also nach sich.
      - name: In Play Store hochladen (geschlossener Test)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: info.movieshelf
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: alpha
          status: completed
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          # Versionshinweise je Sprache: eine Datei "whatsnew-<locale>" pro
          # Uebersetzung. Sie gehen mit dem Bundle hoch, damit sie nicht bei
          # jedem Release von Hand in die Console getippt werden muessen.
          whatsNewDirectory: distribution/whatsnew

      # Bewusst kein APK: getestet wird ueber das Play-Testprogramm, und nur
      # eine Installation von dort zaehlt dafuer. Ein direkt verteiltes APK
      # traegt ausserdem eine andere Signatur (Upload-Key statt des von Google
      # vergebenen App-Signing-Keys) - wer es installiert hat, muss vor dem
      # Wechsel auf die Play-Fassung deinstallieren und verliert dabei seine
      # lokale Sammlung. Dazu kommt, dass Google das Sideloading kuenftig an
      # verifizierte Entwickler bindet.
      - name: GitHub-Release als Versionsmarke
        # Nur bei einem Tag: ein Lauf ueber workflow_dispatch soll kein Release
        # ohne Version anlegen.
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: MovieShelf ${{ github.ref_name }}
          # Es gibt (noch) kein CHANGELOG.md im Repo; die Notizen entstehen aus
          # den Commits seit dem letzten Tag.
          generate_release_notes: true

      # Bewusst kein Artefakt mehr: Das Bundle geht ueber die API direkt in den
      # Internal-Track, und in einem oeffentlichen Repository koennte es sonst
      # jeder angemeldete Nutzer herunterladen. Gebraucht wurde es nur fuer den
      # ersten Upload der neu angelegten App, den die API nicht uebernimmt.

  # Forum-Ankuendigung: postet das fertige Release als Diskussion ins
  # Support-Forum. Analog zum Schritt in forum-release-announcement.yml des
  # SaaS-Repos - dort steht auch die Begruendung, warum Release-Erstellung und
  # Post im selben Lauf passieren muessen: mit GITHUB_TOKEN erstellte Releases
  # loesen absichtlich keine weiteren Workflows aus.
  #
  # Benoetigte Konfiguration (Settings -> Secrets and variables -> Actions):
  #   - Secret   FORUM_API_KEY: Flarum-API-Key (derselbe wie im SaaS-Repo)
  #   - Variable FORUM_TAG_ID:  "2,5" = Release Ankuendigungen + Android
  forum:
    name: Forum-Ankündigung
    needs: [release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Diskussion im Forum erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          FORUM_URL: https://forum.movieshelf.info
          FORUM_API_KEY: ${{ secrets.FORUM_API_KEY }}
          FORUM_TAG_ID: ${{ vars.FORUM_TAG_ID }}
          # Ueber env statt direkt interpoliert: ein praepariertes Tag koennte
          # sonst beliebige Befehle im Runner ausfuehren.
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "$FORUM_API_KEY" ]; then
            echo "::error::Secret FORUM_API_KEY fehlt - Ankuendigung uebersprungen."
            exit 1
          fi

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,body,url > release.json
          RELEASE_NAME=$(jq -r '.name // ""' release.json)
          RELEASE_BODY=$(jq -r '.body // ""' release.json)
          RELEASE_URL=$(jq -r '.url' release.json)

          TITLE="MovieShelf Android ${RELEASE_NAME:-$TAG}"

          CONTENT="${RELEASE_BODY:-Neue Version veroeffentlicht.}

          ---
          [Release auf GitHub ansehen]($RELEASE_URL)"

          jq -n \
            --arg title "$TITLE" \
            --arg content "$CONTENT" \
            --arg tagIds "${FORUM_TAG_ID:-}" \
            '{ data: { type: "discussions", attributes: { title: $title, content: $content } } }
             | ($tagIds | split(",") | map(gsub("\s"; "")) | map(select(. != ""))) as $ids
             | if ($ids | length) > 0 then
                 .data.relationships = { tags: { data: ($ids | map({ type: "tags", id: . })) } }
               else . end' > payload.json

          curl --fail-with-body -sS -X POST "$FORUM_URL/api/discussions" \
            -H "Authorization: Token $FORUM_API_KEY; userId=2" \
            -H "Content-Type: application/json" \
            -d @payload.json

          echo "Forum-Diskussion erstellt."
