name: Play Store Release

# Ausgelöst durch Tag "v*" (analog zum Desktop-Release-Flow) oder manuell.
# Baut ein signiertes App Bundle und lädt es in den Internal-Track hoch;
# die Promotion zu Beta/Produktion passiert bewusst manuell in der Play Console.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        run: ./gradlew testDebugUnitTest --console=plain

  release:
    needs: test
    runs-on: ubuntu-latest
    # Fuer das Anlegen des GitHub-Releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Upload-Keystore bereitstellen
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Signiertes App Bundle bauen
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --console=plain

      # Reihenfolge beachten: bundleRelease und assembleRelease schreiben beide
      # nach mapping/release/mapping.txt, der letzte Lauf gewinnt. Deshalb erst
      # das Bundle hochladen (mit seinem Mapping), danach das APK bauen - sonst
      # bekommt Play das Mapping des APK und deobfuskiert Abstuerze falsch.
      - name: In Play Store hochladen (Internal-Track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: info.movieshelf
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          # Versionshinweise je Sprache: eine Datei "whatsnew-<locale>" pro
          # Uebersetzung. Sie gehen mit dem Bundle hoch, damit sie nicht bei
          # jedem Release von Hand in die Console getippt werden muessen.
          whatsNewDirectory: distribution/whatsnew

      # Bewusst kein APK: getestet wird ueber das Play-Testprogramm, und nur
      # eine Installation von dort zaehlt dafuer. Ein direkt verteiltes APK
      # traegt ausserdem eine andere Signatur (Upload-Key statt des von Google
      # vergebenen App-Signing-Keys) - wer es installiert hat, muss vor dem
      # Wechsel auf die Play-Fassung deinstallieren und verliert dabei seine
      # lokale Sammlung. Dazu kommt, dass Google das Sideloading kuenftig an
      # verifizierte Entwickler bindet.
      - name: GitHub-Release als Versionsmarke
        # Nur bei einem Tag: ein Lauf ueber workflow_dispatch soll kein Release
        # ohne Version anlegen.
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: MovieShelf ${{ github.ref_name }}
          # Es gibt (noch) kein CHANGELOG.md im Repo; die Notizen entstehen aus
          # den Commits seit dem letzten Tag.
          generate_release_notes: true

      # Bewusst kein Artefakt mehr: Das Bundle geht ueber die API direkt in den
      # Internal-Track, und in einem oeffentlichen Repository koennte es sonst
      # jeder angemeldete Nutzer herunterladen. Gebraucht wurde es nur fuer den
      # ersten Upload der neu angelegten App, den die API nicht uebernimmt.
