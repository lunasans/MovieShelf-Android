name: Play Store Release

# Ausgelöst durch Tag "v*" (analog zum Desktop-Release-Flow) oder manuell.
# Baut ein signiertes App Bundle und lädt es in den Internal-Track hoch;
# die Promotion zu Beta/Produktion passiert bewusst manuell in der Play Console.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        run: ./gradlew testDebugUnitTest --console=plain

  release:
    needs: test
    runs-on: ubuntu-latest
    # Fuer das Anlegen des GitHub-Releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Upload-Keystore bereitstellen
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Signiertes App Bundle bauen
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --console=plain

      # Reihenfolge beachten: bundleRelease und assembleRelease schreiben beide
      # nach mapping/release/mapping.txt, der letzte Lauf gewinnt. Deshalb erst
      # das Bundle hochladen (mit seinem Mapping), danach das APK bauen - sonst
      # bekommt Play das Mapping des APK und deobfuskiert Abstuerze falsch.
      - name: In Play Store hochladen (Internal-Track)
        # Eine neu angelegte App nimmt ueber die API erst dann Uploads an, wenn
        # ihre erste Version von Hand in der Console hochgeladen wurde. Damit
        # der Erstlauf nicht am ganzen Workflow scheitert, bleibt dieser Schritt
        # zunaechst folgenlos - nach dem ersten erfolgreichen Upload entfernen,
        # sonst verdeckt er auch echte Fehler.
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: info.movieshelf
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      # Ein AAB laesst sich nicht installieren. Fuer Tester, die nicht auf die
      # Play-Freigabe warten sollen, kommt deshalb zusaetzlich ein APK ans
      # GitHub-Release.
      - name: Signiertes APK bauen (fuer Tester)
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: APK versioniert benennen
        id: apk
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          cp app/build/outputs/apk/release/app-release.apk "MovieShelf-$VERSION.apk"
          echo "name=MovieShelf-$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: GitHub-Release mit APK erstellen
        # Nur bei einem Tag: ein Lauf ueber workflow_dispatch soll kein Release
        # ohne Version anlegen.
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          name: MovieShelf ${{ steps.apk.outputs.version }}
          # Es gibt (noch) kein CHANGELOG.md im Repo; die Notizen entstehen aus
          # den Commits seit dem letzten Tag.
          generate_release_notes: true

      - name: Bundle und APK als Workflow-Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            ${{ steps.apk.outputs.name }}
